name: Publish npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Validate release and set package version in this runner
        id: release
        run: node scripts/release.mjs
      - name: Build and pack the release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm run build
          test "$(node dist/cli.js --version)" = "maccabi $RELEASE_VERSION"
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
      - name: Publish with npm trusted publishing
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish "$RUNNER_TEMP/npm-release/maccabi-health-${RELEASE_VERSION}.tgz" --ignore-scripts --registry https://registry.npmjs.org --access public --provenance --tag "$DIST_TAG"
